name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "docs/TECH_STACK_DECISIONS.md"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "docs/TECH_STACK_DECISIONS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0
          android --sdk="$ANDROID_HOME" sdk install build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "9.7.0"

      - name: Build all three debug APKs
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace \
            :apps:driver:assembleDebug \
            :apps:seller:assembleDebug \
            :apps:owner:assembleDebug

      - name: Run shared unit tests
        working-directory: android
        run: gradle --no-daemon :core:app-shell:testDebugUnitTest
